; 半拍 Banpai — 吧唧 Badge Firmware
; PlatformIO + ESP32-S3, Arduino core
; Target: Waveshare ESP32-S3-Touch-AMOLED-1.75
;   466x466 round QSPI AMOLED (CO5300), touch CST9217, IMU QMI8658,
;   power AXP2101, 16 MB flash, 8 MB PSRAM
;
; !!! 未验证：本机无 PlatformIO、无实板，未跑 pio run / pio check。
;     见 README_FIRMWARE.md「验证状态」一节。
;
; Default env is waveshare_175 (the real badge).
; esp32-s3-devkitc-1 is the bench/dev env (same chip, no round screen).

[platformio]
default_envs = waveshare_175

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Keep firmware lean: old build already used ~78% of its app partition.
; OTA needs TWO app partitions (see partitions.csv) — do not grow the
; app partition to fill the flash, and do not add large built-in bitmaps.
; Dial / wallpaper bitmaps are delivered by the phone App over BLE and
; stored in the single-slot LittleFS area, never compiled in.
board_build.filesystem = littlefs
build_flags =
  -D BANPAI_FW_VERSION=\"0.2.0-ui\"
  -D CORE_DEBUG_LEVEL=2

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -D BANPAI_BOARD_DEVKITC=1
  -D BANPAI_BOARD_NAME=\"esp32-s3-devkitc-1\"
  -D BANPAI_SCREEN_W=466
  -D BANPAI_SCREEN_H=466
  -D BANPAI_SCREEN_ROUND=0
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0

[env:waveshare_175]
board = esp32-s3-devkitc-1
; NOTE: PlatformIO has no built-in "waveshare-1.75" board definition.
; We reuse the esp32-s3-devkitc-1 board (same ESP32-S3R8 chip) and pin
; the Waveshare hardware via build flags + the driver layer in src/.
; If Waveshare publishes a PlatformIO board JSON, swap `board =` to it
; and delete the pin defines below — no application code changes.
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -D BANPAI_BOARD_WAVESHARE_175=1
  -D BANPAI_BOARD_NAME=\"waveshare-1.75\"
  -D BANPAI_SCREEN_W=466
  -D BANPAI_SCREEN_H=466
  -D BANPAI_SCREEN_ROUND=1
  ; --- Waveshare ESP32-S3-Touch-AMOLED-1.75 pin map ---
  ; --- VERIFIED 2026-11-23 against the Waveshare 1.75 schematic
  ; --- (waveshare.net ESP32-S3-Touch-AMOLED-1.75.pdf). The previous
  ; --- values were wrong: LCD D0-D3 were 13-16 (13 is LCD_TE, 14/15
  ; --- are the I2C bus), SCK was 11 (TP_INT), RST was 21 (QMI_INT2),
  ; --- TOUCH_INT/RST were 6/5 (QSPI data lines). Do NOT use the
  ; --- 1.75C BSP reset values (LCD_RST 1 / TP_RST 2) — on the plain
  ; --- 1.75 the resets are direct GPIOs 39/40. AXP IRQ and QMI INT1
  ; --- live on the TCA9554 expander (EXIO5 / EXIO6), not on GPIOs.
  -D BANPAI_PIN_LCD_CS=12
  -D BANPAI_PIN_LCD_SCK=38
  -D BANPAI_PIN_LCD_D0=4
  -D BANPAI_PIN_LCD_D1=5
  -D BANPAI_PIN_LCD_D2=6
  -D BANPAI_PIN_LCD_D3=7
  -D BANPAI_PIN_LCD_RST=39
  -D BANPAI_PIN_LCD_TE=13
  -D BANPAI_PIN_TOUCH_SDA=15
  -D BANPAI_PIN_TOUCH_SCL=14
  -D BANPAI_PIN_TOUCH_INT=11
  -D BANPAI_PIN_TOUCH_RST=40
  -D BANPAI_PIN_IMU_SDA=15
  -D BANPAI_PIN_IMU_SCL=14
  -D BANPAI_PIN_IMU_INT=21
  -D BANPAI_PIN_AXP_SDA=15
  -D BANPAI_PIN_AXP_SCL=14
  ; No BANPAI_PIN_AXP_IRQ: AXP IRQ is TCA9554 EXIO5, not a GPIO.
  ; Do not re-add a GPIO number for it (the old value 4 was QSPI D0).
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0
