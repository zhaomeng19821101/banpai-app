# 半拍 Banpai — Gradle 属性
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compose 编译器：Kotlin 2.0 起才有 org.jetbrains.kotlin.plugin.compose 插件
# （1.9.x 没有这个插件，CI 会报 UnknownPluginException；2026-11-20 实测 1.9.24 的
# 插件标记在 Gradle 插件仓库上是 404，2.0.21 正常）。AGP 8.5.2 + Gradle 8.7 均支持 Kotlin 2.0.21。
