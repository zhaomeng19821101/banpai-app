# 半拍 Banpai — GitHub Actions 自动编 debug APK（2026-11-20 Jackson 定：走 GitHub）
#
# 用法：把 ~/workspace/banpai-code 整个推到 GitHub 仓库。
# 公开仓库：标准 Linux runner 免费无限，4 vCPU / 16 GB；
# 私有仓库：每月 2000 分钟免费，2 vCPU / 8 GB，也够编 debug 包。
# 每次 push 到 main/master 或手动触发，都会编出 app-debug.apk，
# 作为 GitHub Release 的附件发布（单文件 2GB 上限），在仓库 → Releases 里下载。
#
# 注意：
# - 不用 gradlew：工程里的 gradlew 目前是占位脚本（本机 Gradle daemon 起不来，
#   没能生成标准 wrapper；Android Studio 打开工程后可生成）。CI 直接用
#   gradle/actions/setup-gradle 装 Gradle 8.7，用 `gradle` 命令编译。
# - 不需要任何密钥：local.properties 缺省时 AMAP_KEY / AGORA_APP_ID 为空串，
#   探索页显示占位、派对语音占位。不要把真 key 提交进仓库。
# - v0.2：素材全内置（图片 + 视频，571MB，见 assets-manifest.json），APK 约 600MB，
#   离线可看。artifact 上传会超免费存储额度（500MB），所以改走 Release 附件。
#   地图/语音/小模型仍是占位（待接 AMap / Agora SDK 与 Key）。

name: Android Debug APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 Release 附件需要
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认会装已被谷歌下架的旧 "tools" 包，
      # 导致 "Failed to find package 'tools'" 而整步失败（2026-11-20 首跑的教训）。
      # GitHub 的 ubuntu 机器自带 Android SDK（ANDROID_HOME 已配好），直接用它。
      # 注意：sdkmanager 不在默认 PATH 里，要用 cmdline-tools 下的完整路径。
      - name: Install Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # APK 约 600MB（素材全内置），actions/upload-artifact 会超免费存储额度（500MB），
      # 所以改走 GitHub Release 附件（单文件 2GB 上限）。每次推 main 就发一个新 Release，
      # tag = v0.2-<短 commit>；重复跑同一 commit 时改为覆盖上传。
      - name: Publish APK to GitHub Release
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          TAG="v0.3-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "半拍 Banpai v0.3 工程版（$TAG）" \
              --notes "工程版 v0.3：v0.2 拆包核对后修了 5 项（认识半拍横向滑动、打卡距离环、图鉴金瓣闪烁、表盘 8 种时间模板、1:1 好友聊天页）。素材全内置（图片+视频，离线可看），16 屏可点。AMap/Agora Key 未配，地图/语音/小模型为占位；相机 CameraX 与绿幕抠像、BLE 真连、后端联调待下一步。"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
